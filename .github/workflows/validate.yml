name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # hasta que el dominio esté en home-assistant/brands (el icono local va en brand/)
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      # Integración con el arnés de HA (bloquea sockets)
      - run: pytest -q
      # Protocolo contra el router falso (necesita sockets locales)
      - run: pytest -q -p no:homeassistant
